<!-- File này chỉ chứa sidebar, sẽ được nạp vào mọi trang bằng JS (xem script.js).
     Muốn đổi logo, tên, menu... chỉ cần sửa DUY NHẤT file này. -->
<aside class="sidebar">
    <!-- Logo + tên quán -->
    <div class="sidebar-shop">
        <img src="asset/images.jpg" alt="Coffee Logo" class="shop-logo" id="shopLogo">
    </div>
 
    <!-- User đang đăng nhập + chức vụ — nội dung "Tên"/"Chức vụ" chỉ là mặc định,
         sẽ được script.js (UserAPI) ghi đè bằng dữ liệu thật khi trang tải xong. -->
    <div class="sidebar-user">
        <div class="user-name" id="userName">Tên</div>
        <div class="user-role" id="userRole">Chức vụ</div>
    </div>
 
    <div class="sidebar-nav">
        <div class="sidebar-menu">
            <div class="sidebar-menu">
                <a href="Table.html" data-view="tables" class="tab">Bàn</a>
                <a href="Menu.html" data-view="menu" class="tab" id="navMenu">Menu</a>
                <a href="Revenue.html" data-view="revenue" class="tab" id="navRevenue">Doanh thu</a>
                <a href="History.html" data-view="history" class="tab" id="navHistory">Lịch sử</a>
                <a href="Scaff.html" data-view="staff" class="tab" id="navStaff">Nhân viên</a>
            </div>
        </div>
    </div>
 
    <!-- Đăng xuất — luôn nằm ở đáy sidebar nhờ margin-top:auto trong CSS -->
    <div class="sidebar-footer">
        <button type="button" class="btn-logout" id="btnLogout">
            <i class="ri-logout-box-r-line"></i>
            Đăng xuất
        </button>
    </div>
</aside>
